name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Integration tests
        run: bash tests/test.sh

      - name: Format check
        run: clang-format --dry-run --Werror $(git ls-files '*.c' '*.h')

  valgrind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Configure
        run: cmake -S . -B build-valgrind -DENABLE_SANITIZERS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-valgrind

      - name: Unit tests under Valgrind
        run: |
          for test_bin in build-valgrind/test_*; do
            [ -x "$test_bin" ] || continue
            valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 "$test_bin"
          done

      - name: Integration tests under Valgrind
        run: |
          BUILD_DIR=build-valgrind \
          CMAKE_CONFIGURE_ARGS="-DENABLE_SANITIZERS=OFF -DCMAKE_BUILD_TYPE=Debug" \
          ARCHIVER_PREFIX="valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1" \
          bash tests/test.sh

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build-windows -DENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build-windows --config Debug

      - name: Unit tests
        run: ctest --test-dir build-windows -C Debug --output-on-failure
